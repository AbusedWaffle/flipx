<title>FlipX online</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#10192e;color:#fff;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:560px;margin:auto;position:relative;z-index:25}
h1{margin:0;font-size:22px;letter-spacing:1px;flex:1}h1 span{color:#ffcf40}
.pill{font-size:12px;padding:5px 10px;border-radius:20px;background:#1b2a4a;color:#9fb0d0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#6b7a99;display:inline-block;flex:none}
.dot.on{background:#3ddc84}.dot.wait{background:#ffcf40}.dot.off{background:#e0485f}
main{padding:0 12px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.card{background:#1b2a4a;border-radius:16px;padding:14px;margin-bottom:12px}
input,button{font:inherit}
input[type=text],input[type=number],input[type=password]{width:100%;padding:13px;border-radius:10px;border:0;background:#0d1628;color:#fff;font-size:18px;-webkit-user-select:text;user-select:text}
input::placeholder{color:#6b7a99}
#code{text-transform:uppercase;letter-spacing:6px;font-weight:800;text-align:center;font-size:24px}
button{border:0;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35}
.primary{background:#ffcf40;color:#10192e;width:100%}
.ghost{background:#2b3d63;color:#fff}
.danger{background:#5a2330;color:#ffb3c0}
.lbl{font-size:13px;color:#9fb0d0;margin:10px 0 5px}
.hint{color:#9fb0d0;font-size:13px;line-height:1.45}
.err{background:#5a2330;color:#ffd0d8;border-radius:12px;padding:12px;margin-bottom:12px;font-size:15px}
.roomcode{font-size:44px;font-weight:900;letter-spacing:10px;color:#ffcf40;text-align:center;margin:4px 0}
.qr{background:#fff;border-radius:14px;padding:10px;width:210px;height:210px;margin:10px auto}
.qr svg{width:100%;height:100%;display:block}
.link{word-break:break-all;text-align:center;font-size:12px;color:#9fb0d0}
.plist .pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#22345a;margin-bottom:7px;font-size:17px;font-weight:600}
.pl .grow{flex:1}
.x{background:#10192e;color:#9fb0d0;padding:6px 11px;font-size:14px}
/* spil */
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffcf40cc}70%{box-shadow:0 0 0 12px #ffcf4000}100%{box-shadow:0 0 0 0 #ffcf4000}}
.subrow{display:flex;align-items:center;gap:8px;margin:0 2px 6px}
.sub{color:#9fb0d0;font-size:12px;text-align:left;margin:0;flex:1;line-height:1.3}
.leave{background:transparent;color:#9fb0d0;padding:4px 2px;font-size:12px;font-weight:700}
/* spiller-gitter */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;column-gap:4px;row-gap:1px;padding:7px 8px 8px;border-radius:12px;background:#1b2a4a;margin:0;border:0;min-width:0;align-content:start}
.pr.turn{background:#1aaa46}
.pr.is-bust{background:#5c1826}
.pr.is-stopped{background:#3b4150}
.pr.is-stopped .nm,.pr.is-stopped .pts{color:#e4e8ef}
.pr.is-stopped .pts small{color:#c3c9d4}
.pr.is-stopped .sm{filter:grayscale(.85);opacity:.75}
.pr.is-stopped .ain{color:#d8cfa6}
.pr.is-bust .sm{opacity:.6;filter:grayscale(.45)}
.bustx{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:#ff2d4d;text-shadow:0 3px 0 #2a0610,0 0 14px #ff2d4daa;pointer-events:none;line-height:1}
.bustpop{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;background:#e0485fe6;border-radius:12px;animation:slam .4s both;pointer-events:none}
.bustnote{position:absolute;left:6px;right:6px;bottom:6px;z-index:5;background:#e0485f;color:#fff;font-weight:800;font-size:12px;text-align:center;border-radius:8px;padding:3px 4px;pointer-events:none}
.pr .nm{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15;display:flex;align-items:center;gap:4px;min-width:0}
.pr .nm b{overflow:hidden;text-overflow:ellipsis}
.dig{flex:none;font-size:10px;font-weight:800;background:#10192ecc;color:#fff;border-radius:8px;padding:1px 5px;line-height:1.4}
.ain{flex:none;font-weight:800;font-size:11px;color:#ffcf40}
.pr.turn .dig{background:#0b3d1ccc}
.meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-width:0}
.giver{font-size:10px;font-weight:800;color:#ffcf40;white-space:nowrap}
.pr.turn .giver{color:#fff6c2}
.offsmall{font-size:10px;font-weight:700;color:#ffb3c0}
.pr .pts{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:26px;font-weight:900;line-height:.9;text-align:right;color:#fff}
.pr .pts small{display:block;font-size:10px;font-weight:700;color:#c5d2ea;margin-top:2px}
.pr.turn .pts small{color:#e7ffe8}
.pr .sm{grid-column:1 / -1;margin-top:4px}
.grid .sm .c{width:42px;height:56px;font-size:24px;border-radius:7px}
.grid .sm .c.mod{font-size:16px}
.grid .sm .c.fr,.grid .sm .c.f3,.grid .sm .c.sc,.grid .sm .c.et,.grid .sm .c.gv,.grid .sm .c.pa,.grid .sm .c.h2,.grid .sm .c.gh{font-size:16px}
.grid.mid .sm .c{width:34px;height:46px;font-size:18px}
.grid.mid .sm .c.mod{font-size:13px}
.grid.mid .sm .c.fr,.grid.mid .sm .c.f3,.grid.mid .sm .c.sc,.grid.mid .sm .c.et,.grid.mid .sm .c.gv,.grid.mid .sm .c.pa,.grid.mid .sm .c.h2,.grid.mid .sm .c.gh{font-size:13px}
.grid.crowded .sm .c{width:23px;height:31px;font-size:14px}
.grid.crowded .sm .c.mod{font-size:11px}
.grid.crowded .pr .pts{font-size:22px}
.grid.crowded .pr{padding:5px 6px}
/* tilpasset gitter (fitGrid) */
body.ingame .disc{display:none}
.grid.fit{align-content:stretch;overflow:hidden}
.grid.fit .pr{min-height:0;overflow:hidden;position:relative;padding:calc(var(--fs,15px)*.45) calc(var(--fs,15px)*.55)}
.grid.fit .pr .nm{font-size:var(--fs,15px)}
.grid.fit .pr .pts{font-size:calc(var(--fs,15px)*1.75)}
.grid.fit .pr .pts small{font-size:calc(var(--fs,15px)*.68)}
.grid.fit .status,.grid.fit .giver,.grid.fit .dig{font-size:calc(var(--fs,15px)*.68)}
.grid.fit .sm{gap:var(--cg,3px);align-content:flex-start}
.grid.fit .sm .c{width:var(--cw,30px);height:calc(var(--cw,30px)*1.34);font-size:calc(var(--cw,30px)*.56);border-radius:calc(var(--cw,30px)*.16)}
.grid.fit .sm .c.mod,.grid.fit .sm .c.fr,.grid.fit .sm .c.f3,.grid.fit .sm .c.sc,.grid.fit .sm .c.et,.grid.fit .sm .c.gv,.grid.fit .sm .c.pa,.grid.fit .sm .c.h2,.grid.fit .sm .c.gh{font-size:calc(var(--cw,30px)*.4)}
.grid.fit .bustx{font-size:calc(var(--fs,15px)*3.6)}
body.ingame header{padding:6px 10px}
body.ingame h1{font-size:18px}
body.ingame main{padding:0 6px calc(76px + env(safe-area-inset-bottom))}
body.ingame .bottom{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
body.ingame .bottom button{height:56px;font-size:18px;border-radius:12px}
body.ingame .disc{margin:6px 4px 0;padding-bottom:2px}
.c{display:inline-flex;flex-direction:column;width:50px;height:72px;border-radius:9px;align-items:center;justify-content:center;font-weight:900;font-size:28px;background:#f6f1e3;color:#10192e;box-shadow:0 2px 0 #0006;line-height:1;text-align:center}
.c i{font-style:normal;font-size:10px;font-weight:800;margin-top:3px;letter-spacing:.2px}
.c.mod{background:#ff8a3d;color:#fff;font-size:22px}
.c.fr{background:#7fd8ff;color:#0b3550;font-size:24px}
.c.f3{background:#ffcf40;color:#10192e;font-size:24px}
.c.sc{background:#e0485f;color:#fff;font-size:24px}
.c.et{background:#3ddc84;color:#0b2a1a;font-size:24px}
.c.gv{background:#b28dff;color:#1b1030;font-size:22px}
.c.pa{background:#d7e4f5;color:#1a3350;font-size:22px}
.c.h2{background:#2ec4b6;color:#062b27;font-size:22px}
.c.gh{background:#ff6fae;color:#3a0820;font-size:22px}
.c.dup{outline:3px solid #e0485f;background:#ffd6dc;color:#b0102a}
.c.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.sm .c{width:24px;height:33px;font-size:14px;border-radius:5px;box-shadow:none}
.sm .c.mod{font-size:11px}.sm .c.fr,.sm .c.f3,.sm .c.sc,.sm .c.et,.sm .c.gv,.sm .c.pa,.sm .c.h2,.sm .c.gh{font-size:12px}
.sm .c i{display:none}
.sm{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.n0{color:#555}.n1{color:#8a6d3b}.n2{color:#2e8b57}.n3{color:#c0392b}.n4{color:#2471a3}.n5{color:#16a085}.n6{color:#8e44ad}.n7{color:#d35400}.n8{color:#27ae60}.n9{color:#b7950b}.n10{color:#c2185b}.n11{color:#1a5276}.n12{color:#6c3483}
.status{font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;background:#10192e;color:#9fb0d0;white-space:nowrap;line-height:1.5}
.st-active{background:#1e4d3a;color:#8ff0c0}.st-stopped{background:#2b3d63;color:#cfe0ff}.st-bust{background:#e0485f;color:#fff}.st-frozen{background:#7fd8ff;color:#0b3550}.st-seven{background:#ffcf40;color:#10192e}
.rank{width:24px;height:24px;border-radius:50%;background:#10192e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.rank.lead{background:#ffcf40;color:#10192e}
.log div{padding:5px 0;border-bottom:1px solid #22345a;font-size:14px;color:#cfd9ee}
.log div:first-child{color:#fff;font-weight:700}
.log .bust{color:#ff9aab}.log .seven{color:#ffcf40}.log .action{color:#9fe3ff}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#10192ef5;display:flex;gap:10px;max-width:560px;margin:auto}
.bottom button{flex:1;height:68px;font-size:22px}
.bottom .draw{background:#ffcf40;color:#10192e;flex:1.4}
.bottom .stop{background:#3ddc84;color:#0b2a1a}
.bottom.go .draw{animation:pulse 1.2s infinite}
/* Valg af mål direkte i gitteret */
@keyframes tgtpulse{0%,100%{box-shadow:inset 0 0 0 3px #ffcf40,0 0 0 0 #ffcf4000}50%{box-shadow:inset 0 0 0 3px #ffcf40,0 0 0 4px #ffcf4055}}
.grid.picking .pr.tgt{cursor:pointer;animation:tgtpulse 1.1s infinite}
.grid.picking .pr.tgt .tgtchip{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:3;background:#ffcf40;color:#10192e;font-size:11px;font-weight:900;padding:2px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px #0007;pointer-events:none}
.grid.picking .pr.off{opacity:.32;filter:grayscale(.7)}
.grid.picking .pr.soft{opacity:.45;animation:none}
.grid.picking .pr.sel{animation:none;box-shadow:inset 0 0 0 4px #fff,0 0 0 3px #ffcf40,0 0 18px #ffcf40aa;z-index:3}
.selstamp{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:6px;background:#10192e88;border-radius:12px;pointer-events:none}
.selstamp .c{width:44px;height:60px;font-size:24px;transform:rotate(-8deg);box-shadow:0 4px 12px #000a}
.selstamp .c i{display:none}
.selstamp b{font-size:30px;color:#fff;background:#1aaa46;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0008}
.drawbadge{position:absolute;right:6px;bottom:6px;z-index:3;transform:rotate(9deg);pointer-events:none;animation:badgein .45s cubic-bezier(.2,.9,.3,1.3) both}
.drawbadge .c{width:42px;height:58px;font-size:22px;box-shadow:0 0 0 2px #fff,0 0 16px #ffcf40cc,0 4px 10px #000a}
.drawbadge .c i{display:none}
@keyframes badgein{from{transform:translateY(-30px) rotate(-20deg) scale(.6);opacity:0}}
.pr.src{box-shadow:inset 0 0 0 2px #ffffff55}
.c.givsel{outline:3px solid #ffcf40;transform:translateY(-4px);box-shadow:0 6px 10px #0008}
/* Giv væk trin 1: vælg talkortet i din egen brik */
@keyframes gvtap{0%,100%{box-shadow:0 0 0 2px #ffcf40}50%{box-shadow:0 0 0 4px #ffcf40aa}}
.grid.picking .pr.gvsrc{box-shadow:inset 0 0 0 2px #ffffff55}
.pr.gvsrc .c.gvtap{cursor:pointer;animation:gvtap 1.1s infinite;position:relative;z-index:2}
.pr.gvsrc .c.gvtap:active{transform:scale(.94)}
.pr.gvsrc .c.gvoff{opacity:.3;filter:grayscale(.8);pointer-events:none}
.grid.fit .pr.gvsrc .sm{align-items:flex-end}
.grid.fit .pr.gvsrc .sm .c.gvoff{width:calc(var(--cw,30px)*.55);height:calc(var(--cw,30px)*.74);font-size:calc(var(--cw,30px)*.26)}
body.ingame .bottom.pickbar,body.ingame .bottom.waitbar{align-items:center;gap:10px;min-height:72px}
body.ingame .bottom.pickbar{background:#1b2a4a;border-top:2px solid #ffcf40}
body.ingame .bottom.waitbar{background:#10192ef5;border-top:2px solid #2b3d63}
.pickbar .pbcard .c,.waitbar .pbcard .c{width:38px;height:52px;font-size:21px;border-radius:7px;box-shadow:none}
.waitbar .pbcard .c{width:30px;height:42px;font-size:17px;opacity:.85}
.pickbar .pbcard .c i,.waitbar .pbcard .c i{display:none}
.pickbar .pbtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pickbar .pbtxt small{font-size:12px;color:#9fb0d0;font-weight:700}
.pickbar .pbtxt b{font-size:17px;line-height:1.2;color:#fff}
.waitbar .wtxt{flex:1;min-width:0;font-size:15px;font-weight:700;color:#c5d2ea;line-height:1.3}
.waitbar .wtxt b{color:#fff}
body.ingame .bottom.pickbar button{flex:none;height:46px;font-size:15px;padding:0 14px;background:#2b3d63;color:#fff;border-radius:12px}
body.ingame .bottom.pickbar button.undo{background:#fff;color:#10192e}
.pbprog{position:absolute;left:0;top:-2px;height:3px;background:#fff;animation:pbprog var(--undo,1.6s) linear forwards}
@keyframes pbprog{from{width:100%}to{width:0}}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#1b2a4a;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:24px}
table{width:100%;border-collapse:collapse;font-size:16px;margin:8px 0 12px}
th,td{padding:8px 4px;text-align:left;border-bottom:1px solid #2b3d63}
th{color:#9fb0d0;font-weight:500;font-size:13px}
td.n{text-align:right;font-weight:800}
.win{text-align:center;padding:18px;background:linear-gradient(135deg,#ffcf40,#ff8a3d);color:#10192e;border-radius:16px;margin-bottom:12px;font-size:24px;font-weight:900}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(20px);background:#fff;color:#10192e;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 6px 24px #0008;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-size:16px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bust{background:#e0485f;color:#fff}#toast.seven{background:#ffcf40}#toast.action{background:#7fd8ff}
.overlay{position:fixed;inset:0;background:#10192ef0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.overlay .box{max-width:360px}
.spin{width:38px;height:38px;border:4px solid #2b3d63;border-top-color:#ffcf40;border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.disc{color:#6b7a99;font-size:11px;text-align:center;line-height:1.45;margin:10px 8px 0}
.hostfix{background:#3a2a12;border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px}
.hostfix button{margin-top:8px;width:100%}
/* ---------- animationer ---------- */
.c.dealin{animation:dealin .55s cubic-bezier(.2,.9,.3,1.15) both}
.c.glow{animation:dealin .55s cubic-bezier(.2,.9,.3,1.15) both,glowc 1.2s .5s ease-out}
@keyframes dealin{0%{transform:perspective(500px) translateY(-26px) rotateY(180deg) scale(.7);opacity:0;background:#3b5b9a;color:transparent;box-shadow:0 0 0 #0000}
50%{transform:perspective(500px) translateY(-8px) rotateY(90deg) scale(.95);opacity:1;background:#3b5b9a;color:transparent}
100%{transform:none;opacity:1}}
@keyframes glowc{0%{box-shadow:0 0 0 0 #ffcf40ff}50%{box-shadow:0 0 18px 6px #ffcf40cc}100%{box-shadow:0 2px 0 #0006}}
.c.crack{animation:dealin .45s both,cshake .5s .45s}
@keyframes cshake{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-6deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(3px)}}
#app.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-4px)}45%{transform:translate(-7px,2px)}60%{transform:translate(6px,-2px)}75%{transform:translate(-3px,1px)}}
.pr{position:relative}
.fx-shake{animation:shake .5s,flashr 1s}
@keyframes flashr{0%{box-shadow:inset 0 0 0 60px #e0485fdd,0 0 0 0 #e0485f}100%{box-shadow:inset 0 0 0 0 #e0485f00,0 0 0 14px #e0485f00}}
.fx-ice{animation:ice 1.2s}
.fx-land{animation:goldr .8s}
@keyframes ice{0%{box-shadow:inset 0 0 0 40px #e6f7ffcc}100%{box-shadow:inset 0 0 0 0 #e6f7ff00}}
.fx-glow{animation:glowr 1.2s}
@keyframes glowr{0%{box-shadow:0 0 0 0 #ff6b86}40%{box-shadow:0 0 16px 4px #ff6b86}100%{box-shadow:0 0 0 0 #ff6b8600}}
.fx-stop{animation:stopr 1s}
@keyframes stopr{0%{box-shadow:0 0 0 0 #3ddc84aa}100%{box-shadow:0 0 0 14px #3ddc8400}}
.fx-gold{animation:goldr 1.4s}
@keyframes goldr{0%,60%{box-shadow:0 0 22px 6px #ffcf40}100%{box-shadow:0 0 0 0 #ffcf4000}}
.floaty{position:absolute;right:16px;bottom:8px;z-index:3;font-weight:900;font-size:22px;color:#ffcf40;text-shadow:0 2px 0 #0008;pointer-events:none;animation:floaty 1.5s ease-out both;white-space:nowrap}
.floaty.stop{color:#8ff0c0;font-size:17px}
.floaty.sc{color:#ff9aab;font-size:17px}
@keyframes floaty{0%{transform:translateY(12px) scale(.5);opacity:0}20%{transform:translateY(0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.fxrows tr{animation:rowin .45s both}
.fxrows tr:nth-child(2){animation-delay:.1s}.fxrows tr:nth-child(3){animation-delay:.2s}.fxrows tr:nth-child(4){animation-delay:.3s}.fxrows tr:nth-child(5){animation-delay:.4s}.fxrows tr:nth-child(6){animation-delay:.5s}.fxrows tr:nth-child(7){animation-delay:.6s}.fxrows tr:nth-child(8){animation-delay:.7s}.fxrows tr:nth-child(9){animation-delay:.8s}

  return `<div class="card" id="boardCard"><div class="lbl" style="margin-top:0">Rangliste</div><div id="boardList">${body}</div><div class="hint">Sidst kendte navn, sejre, spil og sejrprocent. AI tæller ikke med.</div></div>`;
}
function loadHomeBoard() {
  if (!window.FlipLive) return;
  window.FlipLive.loadBoard().then(rows => {
    boardRows = rows || []; boardError = false;
    if (!role || rejected) renderHome();
  }).catch(() => { boardError = true; boardRows = boardRows || []; if (!role || rejected) renderHome(); });
}
function attachUid() {
  const uid = window.flipUid;
  if (!validUid(uid)) return;
  if (role === 'host' && S) {
    const me = S.players.find(p => p.id === myId);
    if (setFuid(me, uid)) publish();
  } else if (role === 'client' && hostConn && hostConn.open) send(hostConn, { t: 'uid', uid: uid });
}
window.onFlipUid = function (uid) {
  window.flipUid = uid;
  LS.set('uid', uid);
  attachUid();
  if (!role || rejected) loadHomeBoard();
  else if (view && view.phase === 'over') render();
};
window.onFlipBoardFail = function () {
  boardError = true; boardRows = boardRows || [];
  if (!role || rejected) renderHome();
};
window.onFlipNoProfile = function () {
  if (!validUid(window.flipUid)) window.flipUid = '';
  if (!role || rejected) loadHomeBoard();
  else if (view && view.phase === 'over') render();
};
function careerUids(v) {
  const u = [];
  v.players.forEach(p => { if (!p.ai && validUid(p.fuid) && u.indexOf(p.fuid) < 0) u.push(p.fuid); });
  if (validUid(window.flipUid) && u.indexOf(window.flipUid) < 0) u.push(window.flipUid);
  return u;
}
function ensureCareers() {
  if (!window.FlipLive || !view || view.phase !== 'over') return;
  const key = (view.matchId || '') + ':' + careerUids(view).join(',');
  if (careersKey === key) return;
  careersKey = key;
  const mine = window.flipUid;
  const recorded = LS.get('recorded', '') === (room + ':' + (view.matchId || ''));
  window.FlipLive.loadPlayers(careerUids(view)).then(map => {
    careerUids(view).forEach(id => {
      if (recorded && id === mine && career[id]) return;
      if (map && map[id]) career[id] = map[id];
      else career[id] = { name: '', games: 0, wins: 0, missing: true };
    });
    if (view && view.phase === 'over') render();
  }).catch(() => {});
}
function kickRecord() {
  if (!view || view.phase !== 'over' || !window.FlipLive || !view.matchId) return;
  ensureCareers();
  const key = room + ':' + view.matchId;
  if (LS.get('recorded', '') === key || recordBusy === key) return;
  const me = view.players.find(p => p.id === myId);
  if (!me || me.ai || !validUid(window.flipUid)) return;
  recordBusy = key;
  const won = (view.winners || []).some(i => view.players[i] && view.players[i].id === myId);
  window.FlipLive.record(window.flipUid, me.name, won).then(next => {
    LS.set('recorded', key);
    career[window.flipUid] = next;
    if (view && view.phase === 'over') render();
  }).catch(e => { recordBusy = ''; window.flipSaveFail = true; if (view && view.phase === 'over') render(); console.warn('kunne ikke gemme karriere', e && e.message ? e.message : e); });
}

// ---------- start ----------
(function boot() {
  const qroom = (qs.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const sess = LS.get('session', null);
  if (qroom && sess && sess.room === qroom && sess.role === 'host' && LS.get('host-' + qroom)) resumeHost(qroom);
  else if (qroom && sess && sess.room === qroom && sess.role === 'client' && myName) clientJoin(qroom, myName);
  else render();
})();
</script>
